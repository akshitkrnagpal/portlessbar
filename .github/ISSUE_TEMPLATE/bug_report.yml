name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, PortlessBar, Portless, and Node.js versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove private paths, tokens, and credentials before posting.
