name: PortlessBar
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: ${PORTLESSBAR_VERSION}
    CURRENT_PROJECT_VERSION: ${PORTLESSBAR_VERSION}
    DEVELOPMENT_TEAM: 7D6HNDPR5T
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/PortlessSystem/include
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/PortlessSystem/include
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
targets:
  PortlessSystem:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PortlessSystem
        excludes: [include/module.modulemap]
    settings:
      base:
        PRODUCT_NAME: PortlessSystem
        DEFINES_MODULE: YES
        MODULEMAP_FILE: $(SRCROOT)/Sources/PortlessSystem/include/module.modulemap
        SKIP_INSTALL: YES
  PortlessBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/PortlessBar
      - path: Assets/AppIcon.icns
        buildPhase: resources
      - path: Assets/LinkIcons
        excludes: ['*.svg']
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - target: PortlessSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.akshit.PortlessBar
        PRODUCT_NAME: PortlessBar
        ENABLE_TESTABILITY: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: PortlessBar
        CFBundleName: PortlessBar
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Akshit Kr Nagpal.
  PortlessBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PortlessBarTests
      - path: .cloud/TestTools
        type: folder
        buildPhase: resources
    dependencies:
      - target: PortlessBar
      - target: PortlessSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.akshit.PortlessBarTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PortlessBar:
    build:
      targets:
        PortlessBar: all
        PortlessBarTests: [test]
    run:
      commandLineArguments:
        --background: true
    test:
      targets: [PortlessBarTests]
      commandLineArguments:
        --background: true
    archive:
      config: Release
