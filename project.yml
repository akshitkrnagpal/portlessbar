name: PortlessBar
options:
  deploymentTarget:
    macOS: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: ${PORTLESSBAR_VERSION}
    CURRENT_PROJECT_VERSION: ${PORTLESSBAR_VERSION}
    DEVELOPMENT_TEAM: 7D6HNDPR5T
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/PortlessSystem/include
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/PortlessSystem/include
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
  configs:
    Debug:
      DEVELOPMENT_TEAM: ''
      CODE_SIGN_IDENTITY: '-'
      ENABLE_HARDENED_RUNTIME: NO
targets:
  PortlessSystem:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PortlessSystem
        excludes: [include/module.modulemap]
    settings:
      base:
        PRODUCT_NAME: PortlessSystem
        DEFINES_MODULE: YES
        MODULEMAP_FILE: $(SRCROOT)/Sources/PortlessSystem/include/module.modulemap
        SKIP_INSTALL: YES
  PortlessBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/PortlessBar
      - path: Assets/AppIcon.icns
        buildPhase: resources
      - path: Assets/LinkIcons
        excludes: ['*.svg']
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: Assets/Sparkle-LICENSE
        buildPhase: resources
    dependencies:
      - target: PortlessSystem
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.akshit.PortlessBar
        PRODUCT_NAME: PortlessBar
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_FILE: Config/Info.plist
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_TESTABILITY: NO
  PortlessBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PortlessBarTests
    dependencies:
      - target: PortlessBar
      - target: PortlessSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.akshit.PortlessBarTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Optional live test tools
        basedOnDependencyAnalysis: false
        script: |
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TestTools"
          if [ -d "$SRCROOT/.cloud/TestTools" ]; then
            /usr/bin/ditto "$SRCROOT/.cloud/TestTools" "$destination"
          elif [ -d "$destination" ]; then
            /bin/rm -r "$destination"
          fi
schemes:
  PortlessBar:
    build:
      targets:
        PortlessBar: all
        PortlessBarTests: [test]
    run:
      commandLineArguments:
        --background: true
    test:
      targets: [PortlessBarTests]
      commandLineArguments:
        --background: true
    archive:
      config: Release
